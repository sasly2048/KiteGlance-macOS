name: Build

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'scripts/**'
      - 'Package.swift'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'scripts/**'
      - 'Package.swift'

env:
  DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Generate assets
        run: swift run --package-path . generate-assets

      - name: Build debug
        run: swift build --package-path . -c debug

      - name: Build release
        run: swift build --package-path . -c release

      - name: Run tests
        run: swift test --package-path .

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: KiteGlance-macos-arm64
          path: .build/arm64-apple-macosx/release/KiteGlance
          retention-days: 7

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: KiteGlance-macos-arm64
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/KiteGlance
          generate_release_notes: true