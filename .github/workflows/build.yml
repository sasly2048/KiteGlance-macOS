name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build debug
        run: swift build -c debug

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release --arch arm64

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: KiteGlance-macos-arm64
          path: .build/arm64-apple-macosx/release/KiteGlance
          retention-days: 7

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A bare Mach-O binary is not something a user can install: Gatekeeper
      # blocks it and there is no bundle for the Info.plist or icon. Build the
      # real .app and ship a zip of it.
      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/KiteGlance.app dist/KiteGlance-macos-arm64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KiteGlance-macos-arm64.zip
          generate_release_notes: true
